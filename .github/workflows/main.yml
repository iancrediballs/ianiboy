name: Build Ianiboy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype6-dev \
            libgl1-mesa-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev \
            ninja-build

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ianiboy-${{ matrix.name }}
          path: |
            build/**/*.vst3
            build/**/*.component
            build/**/Ianiboy.app
          if-no-files-found: warn
